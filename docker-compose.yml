services:
  cache:
    build:
      context: ./cache
      dockerfile: Dockerfile
    container_name: waze-cache
    volumes:
      - ./cache:/app/cache
      - ./db:/app/db
      - ./cache/data:/app/data
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - waze-network
    command: ["node", "index.js"]

  redis:
    container_name: waze-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./cache/data:/cache/data
    networks:
      - waze-network
    command: redis-server --appendonly yes

  pig:
    build:
      context: .
      dockerfile: ./pig/Dockerfile
    container_name: waze-pig
    volumes:
      - ./pig:/app/pig
      - ./db:/app/db
      - ./cache/data:/app/cache/data
    environment:
      - JAVA_HOME=/usr/local/openjdk-8
      - PIG_HOME=/opt/pig
      - HADOOP_HOME=/opt/hadoop
      - PATH=/opt/pig/bin:/opt/hadoop/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    networks:
      - waze-network
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]

volumes:
  redis-data:

networks:
  waze-network:
    driver: bridge