# ====================================================================
# CONFIGURACIÓN DE APACHE PIG PARA CONTENEDOR DOCKER
# ====================================================================

# Configuración de logs
pig.logfile=/tmp/pig.log
pig.log.dir=/tmp
verbose=true

# Configuración de ejecución
exectype=mapreduce
pig.exec.mapreduce.local.auto.parallism=true

# Configuración de memoria
pig.cachedbag.memusage=0.2
pig.spillable.mem.usage=0.75

# Configuración de esquemas
pig.schematuple=true
pig.schematuple.local.dir=/tmp/pig_schema

# Configuración de optimizaciones
pig.optimizer.rules.disabled=

# Configuración de salida
pig.temp.dir=/tmp/pig-temp

# Configuración para modo local
pig.exec.reducers.bytes.per.reducer=1000000000
pig.exec.reducers.max=999
